secrets:
  bot_config:
    file: ./secrets/bot_config.json
  agent_config:
    file: ./secrets/agent_config.json

services:
  bot:
    container_name: bot
    build:
      context: bot
      dockerfile: bot.Dockerfile
    restart: always
    secrets:
      - bot_config

  agent:
    container_name: agent
    build:
      context: agent
      dockerfile: agent.Dockerfile
    secrets:
      - agent_config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    restart: always
